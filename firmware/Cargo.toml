[workspace.package]
version = "1.0.0"
authors = [ "Joshua Lee Junon <junon@oro.sh> (https://github.com/qix-)" ]
edition = "2024"
repository = "https://github.com/oro-os/link"
license = "MIT"

[workspace]
resolver = "2"

members = [
	"link-firmware",
	"link-rpcapd",
	"link-cli",
	"link-area-daemon",
]

default-members = [
	"link-cli",
	"link-area-daemon"
]

[patch.crates-io]
rmqtt = { git = "https://github.com/oro-os/rmqtt.git" }
rmqtt-net = { git = "https://github.com/oro-os/rmqtt.git" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3       # Maximum optimizations
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
lto = "fat"         # Perform LTO across all crates
