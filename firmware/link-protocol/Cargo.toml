[package]
name = "link-protocol"
description = "Protocol library for the Oro Link"
publish = false
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
version = { workspace = true }

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
serde = ["dep:serde"]
typescript = ["serde", "dep:tsify", "minicbor/alloc"]
defmt = ["dep:defmt"]

[dependencies]
minicbor = { version = "2.2.0", features = ["derive"] }
serde = { version = "1.0.228", optional = true, features = ["derive"] }
tsify = { version = "0.5.6", optional = true, default-features = false, features = ["js"] }
defmt = { version = "1.0.1", default-features = false, optional = true }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.110"
