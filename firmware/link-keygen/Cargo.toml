[package]
name = "link-keygen"
description = "Generate TLS certificate material for Oro Link services"
publish = false
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
version = { workspace = true }

[[bin]]
name = "link-keygen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
rcgen = { version = "0.14.7", features = ["crypto", "pem"] }